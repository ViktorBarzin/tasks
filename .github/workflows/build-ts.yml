name: Build and Push (TypeScript app)

# Off-infra build of the TypeScript port in app/ (ADR-0002; default stack in
# ~/code/docs/adr/0001-default-app-stack.md). Same shape as build.yml, which
# keeps building the live Python image: GitHub-hosted runners build and push
# to GHCR, so the homelab never sees build IO or registry pushes.
#
# Runs when app/** (or this file) changes on master or on a wizard/ts-*
# branch. Branch builds push only the sha tag and deploy nothing; on master
# the image also gets `latest` and the deploy job rolls Deployment tasks-next
# (which serves tasks.viktorbarzin.me since the cutover) through the same
# Woodpecker pipeline build.yml uses. It does not tag semver (build.yml's svu
# step owns the repo's vX.Y.Z tags).
#
# Committed on the FORGEJO side (the mirror is one-way; commits made on GitHub
# are overwritten by the next sync).
on:
  push:
    branches: [master, "wizard/ts-*"]
    paths:
      - "app/**"
      - ".github/workflows/build-ts.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: app

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      # Database tests (and the HTTP tests against the built server) run when
      # TEST_DATABASE_URL is set; each test makes and drops its own database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      # The Python build is the correctness oracle until it is retired: the
      # differential parity suite and the Fernet cross-decrypt test run
      # against backend/'s own virtualenv.
      TASKS_PYTHON_ORACLE: ${{ github.workspace }}/backend/.venv/bin/python
      TASKS_FERNET_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the Python oracle (backend/)
        working-directory: backend
        run: |
          pipx install poetry
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --only main
          test -x .venv/bin/python
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      # Build before the tests: the auth and realtime HTTP tests start
      # .output/server/index.mjs.
      - run: bun run build
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      # e2e/global-setup.ts builds ../frontend with npm for the cutover spec.
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results/
          retention-days: 7

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        working-directory: .
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Dockerfile
          push: true
          platforms: linux/amd64
          # Single-manifest images (no provenance/SBOM attestation children) so
          # registry retention can never orphan index children (ADR-0002).
          provenance: false
          tags: |
            ghcr.io/viktorbarzin/tasks-ts:${{ steps.meta.outputs.sha }}
            ${{ github.ref == 'refs/heads/master' && 'ghcr.io/viktorbarzin/tasks-ts:latest' || '' }}
          # A scope of its own, so this build and build.yml's do not evict
          # each other's layer cache.
          cache-from: type=gha,scope=tasks-ts
          cache-to: type=gha,mode=max,scope=tasks-ts
      # Keep the newest ~10 versions on ghcr (latest rides the newest one).
      - name: ghcr retention (keep 10)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: tasks-ts
          package-type: container
          min-versions-to-keep: 10

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Signal Woodpecker (repo 212 = ViktorBarzin/tasks mirror) to run
      # .woodpecker/deploy.yml, which picks the Deployment from IMAGE_NAME.
      - name: Trigger Woodpecker deploy
        working-directory: .
        run: |
          for attempt in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://ci.viktorbarzin.me/api/repos/212/pipelines" \
              -H "Authorization: Bearer ${{ secrets.WOODPECKER_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"branch\":\"master\",\"variables\":{\"IMAGE_TAG\":\"${{ needs.build.outputs.image_tag }}\",\"IMAGE_NAME\":\"ghcr.io/viktorbarzin/tasks-ts\"}}")
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "Woodpecker deploy triggered (HTTP $STATUS)"; exit 0
            fi
            echo "Attempt $attempt failed (HTTP $STATUS), retrying in 30s..."; sleep 30
          done
          echo "Failed to trigger Woodpecker deploy after 3 attempts"; exit 1

  notify-failure:
    needs: [lint-and-test, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Slack notify
        working-directory: .
        run: |
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: tasks-ts off-infra build FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.SLACK_WEBHOOK }}" || true
