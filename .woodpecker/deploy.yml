# Auto-deploy, triggered ONLY by a GitHub Actions build POSTing to the
# Woodpecker API (manual event, with IMAGE_TAG) after a successful off-infra
# build+push to GHCR (ADR-0002). event:[manual] (NOT push) so the
# Forgejo->GitHub mirror's raw pushes don't fire a spurious deploy.
# The woodpecker-agent SA is cluster-admin — no kubeconfig needed.
#
# Deployment tasks's init container `migrate` runs the Drizzle migrations from
# the same image, so it moves with the app container `tasks`.
when:
  - event: manual

steps:
  - name: check-vars
    image: alpine
    commands:
      - "[ -n \"$IMAGE_TAG\" ] || (echo 'IMAGE_TAG not set — refusing to deploy'; exit 1)"

  - name: deploy
    image: bitnami/kubectl:latest
    commands:
      # A block scalar: Woodpecker substitutes ${IMAGE_TAG} before parsing,
      # and on a push it is empty, which turns "tasks:${IMAGE_TAG} tasks=" in
      # a plain scalar into "tasks: tasks=" and fails the YAML load.
      - |
        kubectl -n tasks set image deployment/tasks migrate=ghcr.io/viktorbarzin/tasks:${IMAGE_TAG} tasks=ghcr.io/viktorbarzin/tasks:${IMAGE_TAG}
        kubectl -n tasks rollout status deployment/tasks --timeout=300s
