# Auto-deploy, triggered ONLY by a GitHub Actions build POSTing to the
# Woodpecker API (manual event, with IMAGE_TAG + IMAGE_NAME) after a successful
# off-infra build+push to GHCR (ADR-0002). event:[manual] (NOT push) so the
# Forgejo->GitHub mirror's raw pushes don't fire a spurious deploy.
# The woodpecker-agent SA is cluster-admin — no kubeconfig needed.
# Generated by infra/scripts/offinfra-onboard.
#
# IMAGE_NAME picks the Deployment:
#   ghcr.io/viktorbarzin/tasks    (build.yml)    -> tasks, the Python build,
#                                                   kept as the rollback target
#   ghcr.io/viktorbarzin/tasks-ts (build-ts.yml) -> tasks-next, the TypeScript
#                                                   build serving the domain
# tasks-next's init container runs the Drizzle migrations from the same
# image, so it moves with the app container.
when:
  - event: manual

steps:
  - name: check-vars
    image: alpine
    commands:
      - "[ -n \"$IMAGE_TAG\" ] || (echo 'IMAGE_TAG not set — refusing to deploy'; exit 1)"

  - name: deploy
    image: bitnami/kubectl:latest
    commands:
      - |
        case "${IMAGE_NAME}" in
          ghcr.io/viktorbarzin/tasks)
            kubectl -n tasks set image deployment/tasks tasks=${IMAGE_NAME}:${IMAGE_TAG}
            kubectl -n tasks rollout status deployment/tasks --timeout=300s
            ;;
          ghcr.io/viktorbarzin/tasks-ts)
            kubectl -n tasks set image deployment/tasks-next migrate=${IMAGE_NAME}:${IMAGE_TAG} tasks-next=${IMAGE_NAME}:${IMAGE_TAG}
            kubectl -n tasks rollout status deployment/tasks-next --timeout=300s
            ;;
          *)
            echo "unknown IMAGE_NAME '${IMAGE_NAME}' — refusing to deploy"
            exit 1
            ;;
        esac
